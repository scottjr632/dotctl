version: "3"

tasks:
  format:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  test:
    desc: Run tests
    cmds:
      - go test ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  build:
    desc: Build dotctl into bin/
    cmds:
      - mkdir -p bin
      - go build -o bin/dotctl .

  install:
    desc: Build and install dotctl into ~/.local/bin
    deps: [build]
    cmds:
      - mkdir -p "$HOME/.local/bin"
      - install -m 0755 bin/dotctl "$HOME/.local/bin/dotctl"

  check:
    desc: Run all checks used by CI
    cmds:
      - 'test -z "$(gofmt -l .)" || { echo "Run: gofmt -w ." >&2; gofmt -l . >&2; exit 1; }'
      - go vet ./...
      - go test ./...
      - go build ./...
